<!DOCTYPE html>
<html lang="nl">
<head>
	<title>404 Pagina niet gevonden</title>
	<style>
		body {
			background-color: #0A080D;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubunti, Cantarell, "Helvetica Neue", sans-serif;
			font-size: 100%;
			margin: 0;
		}

		.shell {
			height: 100vh;
		}

		header {
			height: 56px;
			padding-top: 8px;
			background-color: #18121e;
			color: #FCF8ED;
			display: flex;
			justify-content: center;
		}

		header h1 {
			margin-top: 8px;
			font-size: 24px;
		}

		noscript {
			display: block;
			color: #000;
			background-color: #EAC67A;
			width: 360px;
			margin-left: auto;
			margin-right: auto;
			margin-top: 64px;
			padding: 16px;
		}
		.welcome {
			background-color: #000;
			color: #fff;
			width: 240px;
			margin-left: auto;
			margin-right: auto;
			margin-top: 64px;
			text-align: center;
		}
	</style>
</head>
<body>
<main>
	<div class="shell">
		<header>
			<h1>Team Xerbutri</h1>
		</header>

		<div class="frame">
			<div class="welcome">
				<p>We zijn op zoek naar de juiste pagina. <br>
					Blijft dit bericht staan? Dan kunnen we de pagina niet vinden.<br>
					Ga terug naar de <a href="/" title="Terug naar de Team Xerbutri overzichtspagina">overzichtspagina</a></p>
			</div>
			<noscript>
				<h2>Probleem bij het laden!</h2>
				<p>Javascript is niet geactiveerd. <br/>
					Team Xerbutri gebruikt Javascript voor de werking van de applicatie.</p>
				<h3>Hoe los ik dit op?</h3>
				<p>Voor instructies om Javascript aan te zetten, zie <a
						href="https://www.browserchecker.nl/javascript-aanzetten" target="_blank">Browserchecker,
					Javascript
					aanzetten</a>.
				</p>
			</noscript>
		</div>
	</div>

</main>

</body>
<script>
	
	let route = window.location.pathname;

	if (location.search.includes("geef=")) {
		const subject = location.search.split("geef=")[1].split("&")[0].toLowerCase();
		route = "/avontuur/" + subject;
	}
	
	sessionStorage.redirect = route;
	const l = window.location;
	const repo = "";
	l.replace(
		l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + repo
	);
</script>
</html>
